<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi IA</title>
<style>
  :root {
    --bg: #191919; --side: #141413; --panel: #222221; --text: #e8e6e3;
    --muted: #9a9893; --border: #2f2e2c; --accent: #d97757;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 260px 1fr;
  }
  aside {
    background: var(--side); border-right: 1px solid var(--border);
    padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;
  }
  .brand { font: 600 22px Georgia, serif; padding: 4px 8px; }
  .brand span { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  #new {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; text-align: left;
  }
  #new:hover { background: #2a2a28; }
  #list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  #list button {
    background: none; border: 0; border-radius: 8px; padding: 8px 10px; text-align: left;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #list button:hover, #list button.on { background: var(--panel); color: var(--text); }
  main { display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .hello {
    height: 100%; display: flex; align-items: center; justify-content: center;
    font: 34px Georgia, serif; text-align: center;
  }
  .hello span { color: var(--accent); margin-right: 10px; }
  .m { margin-bottom: 20px; white-space: pre-wrap; word-wrap: break-word; }
  .m.u {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 14px; width: fit-content; max-width: 85%; margin-left: auto;
  }
  .composer { padding: 0 16px 20px; }
  .box {
    max-width: 760px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 18px; padding: 10px 12px;
    display: flex; align-items: flex-end; gap: 8px;
  }
  .box:focus-within { border-color: #4a4946; }
  textarea {
    flex: 1; background: none; border: 0; outline: 0; resize: none; color: var(--text);
    font: inherit; max-height: 200px; padding: 6px 4px;
  }
  #send {
    background: var(--accent); border: 0; border-radius: 10px; width: 36px; height: 36px;
    color: #fff; font-size: 18px; flex-shrink: 0;
  }
  #send:disabled { opacity: .4; cursor: default; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    .hello { font-size: 26px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><span>✦</span> Mi IA</div>
  <button id="new">+ Nuevo chat</button>
  <div id="list"></div>
</aside>

<main>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Escribe tu mensaje..." autofocus></textarea>
      <button id="send" title="Enviar">↑</button>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const wrap = $("wrap"), msgs = $("msgs"), input = $("input"), send = $("send"), list = $("list");

let chats = [];
try { chats = JSON.parse(localStorage.getItem("chats") || "[]"); } catch {}
let current = null;     // chat activo
let ctrl = null;        // para detener la respuesta

const save = () => { try { localStorage.setItem("chats", JSON.stringify(chats)); } catch {} };

function renderList() {
  list.innerHTML = "";
  for (const c of chats) {
    const b = document.createElement("button");
    b.textContent = c.title;
    if (c === current) b.className = "on";
    b.onclick = () => { if (!ctrl) { current = c; renderList(); renderMsgs(); } };
    list.appendChild(b);
  }
}

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "a");
  d.textContent = text;
  wrap.appendChild(d);
  return d;
}

function renderMsgs() {
  wrap.innerHTML = "";
  if (!current || !current.messages.length) {
    wrap.innerHTML = '<div class="hello"><span>✦</span>¿En qué puedo ayudarte?</div>';
    return;
  }
  for (const m of current.messages) addMsg(m.role, m.content);
  msgs.scrollTop = msgs.scrollHeight;
}

function setBusy(busy) {
  send.textContent = busy ? "■" : "↑";
  send.title = busy ? "Detener" : "Enviar";
}

async function submit() {
  if (ctrl) { ctrl.abort(); return; }           // botón = detener mientras responde
  const text = input.value.trim();
  if (!text) return;

  if (!current) {
    current = { title: text.slice(0, 40), messages: [] };
    chats.unshift(current);
  }
  current.messages.push({ role: "user", content: text });
  input.value = ""; input.style.height = "auto";
  renderList(); renderMsgs();

  const el = addMsg("assistant", "…");
  ctrl = new AbortController(); setBusy(true);
  let buf = "", queued = false;

  const paint = () => {                          // 1 repintado por frame = fluido y rápido
    queued = false; el.textContent = buf;
    msgs.scrollTop = msgs.scrollHeight;
  };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: current.messages.slice(-12) }),
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      if (!queued) { queued = true; requestAnimationFrame(paint); }
    }
  } catch (e) {
    if (e.name !== "AbortError") buf += (buf ? "\n\n" : "") + "[Error: " + e.message + "]";
  }
  paint();
  if (buf.trim()) current.messages.push({ role: "assistant", content: buf });
  else current.messages.pop();                   // si no hubo respuesta, se quita el mensaje huérfano
  save(); ctrl = null; setBusy(false); input.focus();
}

send.onclick = submit;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});
$("new").onclick = () => { if (!ctrl) { current = null; renderList(); renderMsgs(); input.focus(); } };

renderList(); renderMsgs();
</script>
</body>
</html>
